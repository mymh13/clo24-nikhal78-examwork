name: OIDC Smoke Test (Azure login)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # krävs för OIDC-login

jobs:
  login-test:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure context
        run: |
          az account show -o table
          echo "Tenant: $(az account show --query tenantId -o tsv)"
          echo "Sub:    $(az account show --query id -o tsv)"
