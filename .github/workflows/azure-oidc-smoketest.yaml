name: OIDC Smoke Test (Azure login)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  login-test:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Azure OIDC login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify Azure login (no IDs in logs)
        shell: bash
        run: |
          set -e
          # Bekräfta att CLI har en giltig kontext, men skriv inget till loggen
          az account show > /dev/null

          # Validera tyst att vi är i rätt subscription (ingen echo av värden)
          sub_now="$(az account show --query id -o tsv)"
          if [ "$sub_now" != "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "Azure login OK men subscription-kontekst matchar inte förväntat."
            exit 1
          fi

          echo "Azure OIDC login verifierad."