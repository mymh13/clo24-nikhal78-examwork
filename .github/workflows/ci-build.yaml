name: CI - Build solution

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build --configuration Release --no-restore

      # Publish Web (landing page) as artifact for CD to consume later
      - name: Publish Ticketing.Web
        run: dotnet publish src/web/Ticketing.Web/Ticketing.Web.csproj -c Release -o out/web

      # (Optional) Publish API now or later; leaving here for when we add a controller
      # - name: Publish Ticketing.Api
      #   run: dotnet publish src/api/Ticketing.Api/Ticketing.Api.csproj -c Release -o out/api

      - name: Upload Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-publish
          path: out/web
          if-no-files-found: error
