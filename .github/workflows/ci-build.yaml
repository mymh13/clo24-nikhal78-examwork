name: CI - Build solution

on:
  push:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - '.github/workflows/ci-build.yaml'
      - '*.sln'
      - '*.csproj'
      - '**/Dockerfile'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - '.github/workflows/ci-build.yaml'
      - '*.sln'
      - '*.csproj'
      - '**/Dockerfile'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  packages: write  # Required for pushing to GHCR

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true  # Cancel duplicate runs

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.short_sha }}
      full_sha: ${{ steps.version.outputs.full_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for versioning

      - name: Extract version from Git
        id: version
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          FULL_SHA=$(git rev-parse HEAD)
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "full_sha=$FULL_SHA" >> $GITHUB_OUTPUT
          echo "version=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "Version: $SHORT_SHA"

      # Build and push Docker image to GHCR
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/web/Ticketing.Web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/web:${{ steps.version.outputs.short_sha }}
            ghcr.io/${{ github.repository_owner }}/${{ github.event.repository.name }}/web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
