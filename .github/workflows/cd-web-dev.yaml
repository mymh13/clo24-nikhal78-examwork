name: CD - Deploy Web (dev)

on:
  workflow_run:
    workflows: [ "CI - Build solution" ]
    types: [ "completed" ]

permissions:
  contents: read
  id-token: write    # required for OIDC login to Azure

env:
  ARTIFACT_NAME: web-publish

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Download build artifact from CI
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}
          path: web-publish

      - name: Set up Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify target Web App exists
        id: probe
        shell: bash
        run: |
          if ! az webapp show -n "${{ vars.WEBAPP_NAME }}" -g "${{ vars.WEBAPP_RG }}" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (no Web App yet)
        if: steps.probe.outputs.exists == 'false'
        run: |
          echo "App Service '${{ vars.WEBAPP_NAME }}' not found. Skipping deployment."
          exit 0

      - name: Verify deployment package
        if: steps.probe.outputs.exists == 'true'
        run: |
          echo "Checking deployment package contents..."
          ls -la web-publish/ | head -20
          if [ -f "web-publish/Ticketing.Web.dll" ]; then
            echo "✓ Ticketing.Web.dll found"
          else
            echo "✗ Ticketing.Web.dll NOT found!"
            exit 1
          fi

      - name: Stop App Service (force container refresh)
        if: steps.probe.outputs.exists == 'true'
        run: |
          az webapp stop --name "${{ vars.WEBAPP_NAME }}" --resource-group "${{ vars.WEBAPP_RG }}"

      - name: Deploy to Azure Web App
        if: steps.probe.outputs.exists == 'true'
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.WEBAPP_NAME }}
          package: web-publish
          clean: true

      - name: Force .NET runtime configuration and restart
        if: steps.probe.outputs.exists == 'true'
        run: |
          # Explicitly set runtime stack to force .NET container image
          az webapp config set \
            --name "${{ vars.WEBAPP_NAME }}" \
            --resource-group "${{ vars.WEBAPP_RG }}" \
            --linux-fx-version "DOTNET|8.0" \
            --startup-file "dotnet Ticketing.Web.dll"
          
          # Ensure app settings are set
          az webapp config appsettings set \
            --name "${{ vars.WEBAPP_NAME }}" \
            --resource-group "${{ vars.WEBAPP_RG }}" \
            --settings WEBSITE_STACK=DOTNET SCM_DO_BUILD_DURING_DEPLOYMENT=false
          
          # Verify configuration
          echo "Current runtime config:"
          az webapp config show \
            --name "${{ vars.WEBAPP_NAME }}" \
            --resource-group "${{ vars.WEBAPP_RG }}" \
            --query "{linuxFxVersion: linuxFxVersion, appCommandLine: appCommandLine}" -o json
          
          # Restart to apply changes
          az webapp restart --name "${{ vars.WEBAPP_NAME }}" --resource-group "${{ vars.WEBAPP_RG }}"
          echo "App Service restarted. Waiting 15 seconds for container to initialize..."
          sleep 15
