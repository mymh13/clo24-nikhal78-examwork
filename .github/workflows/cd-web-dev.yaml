name: CD - Deploy Web (dev)

on:
  workflow_run:
    workflows: [ "CI - Build solution" ]
    types: [ "completed" ]

permissions:
  contents: read
  id-token: write    # required for OIDC login to Azure

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Set up Azure CLI
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Verify target Web App exists
        id: probe
        shell: bash
        run: |
          if ! az webapp show -n "${{ vars.WEBAPP_NAME }}" -g "${{ vars.WEBAPP_RG }}" >/dev/null 2>&1; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (no Web App yet)
        if: steps.probe.outputs.exists == 'false'
        run: |
          echo "App Service '${{ vars.WEBAPP_NAME }}' not found. Skipping deployment."
          exit 0

      - name: Restart App Service to pull latest image
        if: steps.probe.outputs.exists == 'true'
        run: |
          # CI workflow always pushes to 'latest' tag
          echo "Restarting App Service to pull latest container image..."
          az webapp restart --name "${{ vars.WEBAPP_NAME }}" --resource-group "${{ vars.WEBAPP_RG }}"
          echo "App Service restarted. New image will be pulled on next request."
